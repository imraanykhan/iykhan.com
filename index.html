<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I. Y. Khan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0d;
      --card-bg: #12141a;
      --border: #232733;
      --text: #e6edf3;
      --text-muted: #848a96;
      --accent: #c4a77d; /* Subtle antique gold */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: 'EB Garamond', Georgia, serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      letter-spacing: 0.02em;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      max-width: 480px;
      width: 100%;
      padding: 3rem 2.5rem;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      position: relative;
    }

    /* Subtle gothic accent line */
    .card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 25%;
      right: 25%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
    }

    h1 {
      font-family: 'Cinzel', serif;
      font-size: 2.1rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #f0f4fc;
      margin-bottom: 0.35rem;
    }

    p.subtitle {
      font-family: 'Cinzel', serif;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      font-size: 0.85rem;
      margin-bottom: 1.75rem;
    }

    p.bio {
      color: var(--text-muted);
      line-height: 1.75;
      font-size: 1.05rem;
      margin-bottom: 2.25rem;
    }

    .inquiry {
      font-size: 0.95rem;
      color: var(--text-muted);
      border-top: 1px solid var(--border);
      padding-top: 1.5rem;
    }

    .inquiry a {
      color: var(--text);
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-color: var(--accent);
      transition: color 0.15s ease;
    }

    .inquiry a:hover {
      color: var(--accent);
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #555b68;
      letter-spacing: 0.08em;
      font-family: 'Cinzel', serif;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>I. Y. Khan</h1>
    <p class="subtitle">Writer</p>
    <p class="bio">
      I write fiction. More coming circa summer 2027.
    </p>
    <div class="inquiry">
      For business inquiries, contact <a href="mailto:contact@iykhan.com">contact@iykhan.com</a>
    </div>
    <footer>&copy; 2026 I. Y. Khan</footer>
  </div>
</body>
</html>
